[package]
name = "rustyhusky"
version = "0.1.0"
edition = "2021"
description = "A Rust starter framework for portrait games with automatic 1080 x 1920, 60 fps gameplay recording"
license = "GPL-3.0-or-later"
repository = "https://github.com/ricande/RustyHusky"
readme = "README.md"
publish = false

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
# Optimise dependencies even in debug builds so `cargo run` stays smooth.
opt-level = 2
