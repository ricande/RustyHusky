name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Tests that need ffmpeg fail instead of skipping when it is missing.
  REQUIRE_FFMPEG: 1

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages (X11, ALSA, OpenGL, FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Vendored miniquad is the published crate plus our patches
        run: ./scripts/check-vendored-miniquad.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # With FFmpeg installed, the video tests encode and check real MP4s.
      - run: cargo test --locked

  msrv:
    name: build with the minimum Rust version (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  other-platforms:
    name: clippy and tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # With FFmpeg, the recording tests encode real MP4s here too. Tests
      # that use `sh` run on macOS; the slow-encoder ones need GNU `dd` and
      # run on Linux only.
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
